<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@keyframes flipPage {
  0%   { transform: translateZ(0px)  rotateY(0deg); }
  9%   { transform: translateZ(6px)  rotateY(-14deg); }
  22%  { transform: translateZ(22px) rotateY(-90deg); }
  36%  { transform: translateZ(7px)  rotateY(-166deg); }
  44%  { transform: translateZ(0px)  rotateY(-180deg); }
  100% { transform: translateZ(0px)  rotateY(-180deg); }
}
@keyframes flipShade {
  0%   { opacity: 0; }
  9%   { opacity: .32; }
  22%  { opacity: .5; }
  36%  { opacity: .28; }
  44%  { opacity: 0; }
  100% { opacity: 0; }
}
@keyframes castShadow {
  0%   { opacity: 0; transform: scaleX(1); }
  22%  { opacity: .22; transform: scaleX(.6); }
  44%  { opacity: 0; transform: scaleX(1); }
  100% { opacity: 0; }
}
@keyframes bookBreathe {
  0%, 100% { transform: rotateX(22deg) rotateZ(-1.5deg) translateY(0px); }
  50%      { transform: rotateX(22deg) rotateZ(-1.5deg) translateY(-3px); }
}
</style>
</helmet>
<div style="min-height:100vh;background:transparent;display:flex;align-items:center;justify-content:center;">

  <div style="position:relative;width:220px;height:190px;">
    <!-- ground shadow -->
    <div style="position:absolute;left:50%;bottom:6px;width:180px;height:26px;transform:translateX(-50%);background:radial-gradient(ellipse at center,rgba(90,55,25,.28),rgba(90,55,25,0) 70%);filter:blur(2px);"></div>

    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;perspective:900px;">
      <div style="position:relative;width:264px;height:172px;transform-style:preserve-3d;animation:bookBreathe 4.4s ease-in-out infinite;transform:rotateX(22deg) rotateZ(-1.5deg);">

        <!-- back cover (coral) -->
        <div style="position:absolute;left:-9px;top:-8px;width:282px;height:188px;background:linear-gradient(160deg,#E06A3C,#CE4E28);border-radius:6px 12px 12px 6px;transform:translateZ(-16px);box-shadow:0 10px 22px -10px rgba(120,50,20,.6);"></div>
        <!-- fore-edge page block -->
        <div style="position:absolute;left:-4px;top:-3px;width:272px;height:178px;background:repeating-linear-gradient(to bottom,#F3E9D4 0 2px,#E7D9BC 2px 4px);border-radius:4px;transform:translateZ(-9px);"></div>
        <!-- spine gutter shadow -->
        <div style="position:absolute;left:130px;top:0;width:4px;height:172px;background:linear-gradient(90deg,rgba(120,80,40,.28),rgba(120,80,40,0),rgba(120,80,40,.28));"></div>
        <!-- gold spine thread -->
        <div style="position:absolute;left:131px;top:6px;width:2px;height:160px;background:linear-gradient(#EFC768,#E3B341);border-radius:2px;transform:translateZ(1px);"></div>

        <!-- left resting page -->
        <div style="position:absolute;left:0;top:0;width:132px;height:172px;background:#FFFDF8;border-radius:4px 2px 2px 4px;box-shadow:inset -7px 0 9px -7px rgba(120,80,40,.22);">
          <div style="position:absolute;inset:16px 14px 16px 18px;background:repeating-linear-gradient(to bottom,rgba(190,140,80,.30) 0 1.2px,transparent 1.2px 13px);"></div>
        </div>
        <!-- right resting page -->
        <div style="position:absolute;left:132px;top:0;width:132px;height:172px;background:#FFFDF8;border-radius:2px 4px 4px 2px;box-shadow:inset 7px 0 9px -7px rgba(120,80,40,.22);">
          <div style="position:absolute;inset:16px 18px 16px 14px;background:repeating-linear-gradient(to bottom,rgba(190,140,80,.30) 0 1.2px,transparent 1.2px 13px);"></div>
        </div>

        <!-- cast shadow onto left page while a leaf turns -->
        <div style="position:absolute;left:0;top:0;width:132px;height:172px;border-radius:4px 2px 2px 4px;background:linear-gradient(90deg,rgba(90,55,25,.5),rgba(90,55,25,0));transform-origin:right center;animation:castShadow 2.2s linear infinite;"></div>
        <div style="position:absolute;left:0;top:0;width:132px;height:172px;border-radius:4px 2px 2px 4px;background:linear-gradient(90deg,rgba(90,55,25,.5),rgba(90,55,25,0));transform-origin:right center;animation:castShadow 2.2s linear infinite;animation-delay:-1.1s;"></div>

        <!-- flipping leaf 1 -->
        <div style="position:absolute;left:132px;top:0;width:132px;height:172px;transform-origin:left center;transform-style:preserve-3d;animation:flipPage 2.2s linear infinite;">
          <div style="position:absolute;inset:0;background:#FFFEFA;border-radius:2px 5px 5px 2px;backface-visibility:hidden;box-shadow:0 6px 14px -6px rgba(120,70,30,.4);">
            <div style="position:absolute;inset:16px 18px 16px 14px;background:repeating-linear-gradient(to bottom,rgba(190,140,80,.30) 0 1.2px,transparent 1.2px 13px);"></div>
            <div style="position:absolute;inset:0;border-radius:2px 5px 5px 2px;background:linear-gradient(255deg,rgba(120,80,40,.25),rgba(255,255,255,0) 55%);animation:flipShade 2.2s linear infinite;"></div>
          </div>
          <div style="position:absolute;inset:0;background:#FFFEFA;border-radius:5px 2px 2px 5px;backface-visibility:hidden;transform:rotateY(180deg);">
            <div style="position:absolute;inset:16px 14px 16px 18px;background:repeating-linear-gradient(to bottom,rgba(190,140,80,.30) 0 1.2px,transparent 1.2px 13px);"></div>
          </div>
        </div>
        <!-- flipping leaf 2 (offset) -->
        <div style="position:absolute;left:132px;top:0;width:132px;height:172px;transform-origin:left center;transform-style:preserve-3d;animation:flipPage 2.2s linear infinite;animation-delay:-1.1s;">
          <div style="position:absolute;inset:0;background:#FFFEFA;border-radius:2px 5px 5px 2px;backface-visibility:hidden;box-shadow:0 6px 14px -6px rgba(120,70,30,.4);">
            <div style="position:absolute;inset:16px 18px 16px 14px;background:repeating-linear-gradient(to bottom,rgba(190,140,80,.30) 0 1.2px,transparent 1.2px 13px);"></div>
            <div style="position:absolute;inset:0;border-radius:2px 5px 5px 2px;background:linear-gradient(255deg,rgba(120,80,40,.25),rgba(255,255,255,0) 55%);animation:flipShade 2.2s linear infinite;animation-delay:-1.1s;"></div>
          </div>
          <div style="position:absolute;inset:0;background:#FFFEFA;border-radius:5px 2px 2px 5px;backface-visibility:hidden;transform:rotateY(180deg);">
            <div style="position:absolute;inset:16px 14px 16px 18px;background:repeating-linear-gradient(to bottom,rgba(190,140,80,.30) 0 1.2px,transparent 1.2px 13px);"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
